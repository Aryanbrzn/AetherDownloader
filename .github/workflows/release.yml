name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (e.g. 1.0.1). Used only for manual runs."
        required: false
        type: string

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } elseif ("${{ inputs.version }}") {
            $version = "${{ inputs.version }}".TrimStart("v")
          } else {
            $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Version must start with major.minor.patch (got '$version'). Use a tag like v1.0.1"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building version $version"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Pack zip + MSI
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;" + $env:PATH
          ./scripts/pack-release.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AetherDownloader-win-x64
          path: |
            artifacts/AetherDownloader-v${{ steps.ver.outputs.version }}-win-x64.zip
            artifacts/AetherDownloader-v${{ steps.ver.outputs.version }}-win-x64.msi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/AetherDownloader-v${{ steps.ver.outputs.version }}-win-x64.zip
            artifacts/AetherDownloader-v${{ steps.ver.outputs.version }}-win-x64.msi
          body: |
            ## Downloads
            - **MSI installer** — recommended for most users (Start Menu shortcut, uninstall from Apps & features)
            - **ZIP** — portable self-contained folder (`AetherDownloader.App.exe`)

            ## Notes
            - Self-contained win-x64 (no separate .NET install)
            - yt-dlp / FFmpeg are not bundled; the app can download official builds into LocalAppData
            - Intended for personal archiving, education, and public-domain / Creative Commons media
